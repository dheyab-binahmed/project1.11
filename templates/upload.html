{% extends 'base.html' %} {% block title %}Upload Files{% endblock %} {% block
content %}
<div class="container-fluid p-4">
  <div class="row justify-content-center">
    <div class="col-xl-8 col-lg-10">
      <div class="card animate__animated animate__fadeInUp">
        <div class="card-header bg-success text-white">
          <h3 class="mb-0">
            <i class="fas fa-file-upload me-2"></i>Upload PDF Files
          </h3>
        </div>

        <div class="card-body">
          <form
            method="post"
            enctype="multipart/form-data"
            class="dropzone"
            id="uploadForm"
          >
            <div class="mb-4">
              <label for="file" class="form-label">Select PDF Files</label>
              <div class="input-group">
                <input
                  type="file"
                  class="form-control"
                  id="file"
                  name="file"
                  multiple
                  accept=".pdf"
                  required
                />
                <button class="btn btn-success" type="button" id="clearFiles">
                  <i class="fas fa-times"></i>
                </button>
              </div>
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-success btn-lg">
                <i class="fas fa-cloud-upload-alt me-2"></i>Upload & Process
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

<!-- Override the footer block to remove it -->
{% block footer %} {% endblock %}
