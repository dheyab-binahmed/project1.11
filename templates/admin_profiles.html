{% extends 'base.html' %} {% block title %}User Management{% endblock %} {%
block content %}
<div class="container-fluid p-4">
  <h2>User Management</h2>
  <table class="table table-hover">
    <thead>
      <tr>
        <th>Username</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for user in users %}
      <tr>
        <td>{{ user[0] }}</td>
        <td>
          <a
            href="{{ url_for('admin_update_profile', username=user[0]) }}"
            class="btn btn-warning btn-sm"
          >
            <i class="fas fa-edit"></i> Edit
          </a>
          <a
            href="{{ url_for('admin_remove_user', username=user[0]) }}"
            class="btn btn-danger btn-sm"
            onclick="return confirmRemove('{{ user[0] }}')"
          >
            <i class="fas fa-trash"></i> Remove
          </a>
          <a
            href="{{ url_for('admin_user_history', username=user[0]) }}"
            class="btn btn-info btn-sm"
          >
            <i class="fas fa-history"></i> History
          </a>
          <a
            href="{{ url_for('admin_user_stats', username=user[0]) }}"
            class="btn btn-info btn-sm"
          >
            <i class="fas fa-chart-bar"></i> Stats
          </a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

<script>
  function confirmRemove(username) {
    return confirm(`Are you sure you want to remove the user "${username}"?`);
  }
</script>
{% endblock %}
